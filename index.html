function b64buf(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

async function unlock(){
  const pw=document.getElementById('pw').value;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64buf(SALT),iterations:100000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']
    );
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64buf(IV)},key,b64buf(CT));
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch{
    document.getElementById('err').textContent='パスワードが違います';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}

document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
